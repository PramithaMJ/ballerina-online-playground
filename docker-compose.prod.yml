version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ballerina-playground-backend
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - GIN_MODE=release
      - TEMP_DIR=/tmp/ballerina-playground
      - HOST_TEMP_DIR=/tmp/ballerina-playground
      - GOMAXPROCS=2
      - ALLOWED_ORIGIN=https://pramithamj.github.io,https://ballerina-online-playground.pages.dev
      # Cloudflare Turnstile - IMPORTANT: Replace with actual secret key for production!
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-0x4AAAAAAB6jL8GkY6JoK2n471Y50s2lLvM}
      - ENABLE_TURNSTILE_VERIFICATION=${ENABLE_TURNSTILE_VERIFICATION:-true}
    env_file:
      - ./backend/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/ballerina-playground:/tmp/ballerina-playground:rw
    restart: always
    # Resource limits for docker-compose v1 compatibility
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
