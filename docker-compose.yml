version: "3.9"

services:
  # Backend service (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ballerina-playground-backend
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - GIN_MODE=release
      - TEMP_DIR=/tmp/ballerina-playground
      - HOST_TEMP_DIR=${PWD}/.tmp/ballerina-playground
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for Docker execution
      - ${PWD}/.tmp/ballerina-playground:/tmp/ballerina-playground  # Shared temp directory
    restart: unless-stopped
    networks:
      - playground-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service (Vite + React)
  frontend:
    build:
      context: ./frontend-vite
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://54.160.240.225:8081
    container_name: ballerina-playground-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - playground-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  playground-network:
    driver: bridge

volumes:
  ballerina-temp:
    driver: local

