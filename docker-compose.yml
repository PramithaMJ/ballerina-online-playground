version: "3.9"

services:
  # Backend service (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ballerina-playground-backend
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - GIN_MODE=release
      - TEMP_DIR=/tmp/ballerina-playground
      - HOST_TEMP_DIR=/tmp/ballerina-playground
      - GOMAXPROCS=2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for Docker execution
      - /tmp/ballerina-playground:/tmp/ballerina-playground:rw  # Shared temp directory with read-write access
    restart: unless-stopped
    networks:
      - playground-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service (Vite + React)
  frontend:
    build:
      context: ./frontend-vite
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://54.196.236.102:8081
    container_name: ballerina-playground-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - playground-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  playground-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

volumes:
  ballerina-temp:
    driver: local

