<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>OG Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1a1d24 0%, #2d3748 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Decorative background circles */
        .circle-1 {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 80, 0, 0.15) 0%, transparent 70%);
        }
        
        .circle-2 {
            position: absolute;
            bottom: -150px;
            right: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 122, 0, 0.15) 0%, transparent 70%);
        }
        
        /* Decorative brackets */
        .bracket {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 180px;
            font-weight: bold;
            opacity: 0.1;
        }
        
        .bracket-left {
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            color: #FF5000;
        }
        
        .bracket-right {
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            color: #FF7A00;
        }
        
        /* Main content container */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            max-width: 1000px;
        }
        
        /* Logo */
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 35px;
            background: linear-gradient(135deg, #FF5000 0%, #FF7A00 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(255, 80, 0, 0.3);
        }
        
        .logo-shape {
            width: 60px;
            height: 60px;
            background: #FFFFFF;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
        
        /* Title */
        h1 {
            font-size: 70px;
            font-weight: 800;
            color: #FFFFFF;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
            line-height: 1.1;
        }
        
        /* Subtitle */
        .subtitle {
            font-size: 30px;
            color: #CBD5E0;
            margin: 0 0 50px 0;
            font-weight: 400;
            letter-spacing: -0.5px;
        }
        
        /* Features container */
        .features {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            margin-top: 45px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            color: #E2E8F0;
            font-weight: 500;
        }
        
        .feature-icon {
            width: 14px;
            height: 14px;
            background: #48BB78;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(72, 187, 120, 0.5);
        }
        
        /* URL footer */
        .url {
            margin-top: 50px;
            font-size: 20px;
            color: #718096;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <!-- Background decoration -->
    <div class="circle-1"></div>
    <div class="circle-2"></div>
    <div class="bracket bracket-left">{</div>
    <div class="bracket bracket-right">}</div>
    
    <!-- Main content -->
    <div class="content">
        <div class="logo">
            <div class="logo-shape"></div>
        </div>
        
        <h1>Ballerina Online Playground</h1>
        
        <div class="subtitle">
            Write, Compile & Execute Ballerina Code in Real-Time
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon"></div>
                <span> Multiple Versions</span>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                <span>💻 Monaco Editor</span>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                <span>⚡ Instant Execution</span>
            </div>
        </div>
        
        <div class="url">
            ballerina-online-playground.pages.dev
        </div>
    </div>
</body>
</html>
